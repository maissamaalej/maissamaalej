<svg viewBox="0 0 1000 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maissa Maalej - Cloud and DevOps Engineering Student" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#2c5364"/>
      <stop offset="1" stop-color="#7f5af0"/>
    </linearGradient>
  </defs>

  <style>
    .name { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 700; font-size: 66px; fill: #ffffff; animation: fade 1.6s ease-out both; }
    .sub  { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 22px; letter-spacing: 3px; fill: #e1d8ff; animation: fade 1.6s ease-out .5s both; }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .tw { animation: tw 2.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
  </style>

  <rect width="1000" height="240" fill="url(#g)"/>

  <!-- sparkles -->
  <circle class="tw" cx="90"  cy="50"  r="3" fill="#fff" style="animation-delay:0s"/>
  <circle class="tw" cx="220" cy="140" r="2" fill="#4de1c1" style="animation-delay:.7s"/>
  <circle class="tw" cx="330" cy="40"  r="2" fill="#ff9ecf" style="animation-delay:1.3s"/>
  <circle class="tw" cx="700" cy="45"  r="3" fill="#fff" style="animation-delay:.4s"/>
  <circle class="tw" cx="820" cy="120" r="2" fill="#ffd166" style="animation-delay:1.8s"/>
  <circle class="tw" cx="920" cy="55"  r="2" fill="#4de1c1" style="animation-delay:1s"/>

  <!-- text -->
  <text class="name" x="500" y="112" text-anchor="middle">Maissa Maalej</text>
  <text class="sub"  x="500" y="155" text-anchor="middle">CLOUD &amp; DEVOPS ENGINEERING STUDENT</text>

  <!-- waves -->
  <g>
    <path fill="#ffffff" fill-opacity="0.12" d="M0,190 Q125,160 250,190 T500,190 T750,190 T1000,190 T1250,190 T1500,190 T1750,190 T2000,190 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#ffffff" fill-opacity="0.18" d="M0,205 Q125,180 250,205 T500,205 T750,205 T1000,205 T1250,205 T1500,205 T1750,205 T2000,205 V240 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
